spring.application.name=FitnessTracker

# ==============================
#   DATABASE CONFIGURATION
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
#   JPA & HIBERNATE CONFIG
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==============================
#   SERVER CONFIG
# ==============================
server.port=8080

# ==============================
#   HIKARI CONNECTION POOL TUNING
# ==============================

# DB ba?lant?s? al?namazsa max bekleme (ms)
spring.datasource.hikari.connection-timeout=20000

# Havuzda her zaman aç?k tutulacak min ba?lant?
spring.datasource.hikari.minimum-idle=2

# Maksimum DB ba?lant?s? (Render free-tier için ideal)
spring.datasource.hikari.maximum-pool-size=5

# Bo?ta kalan ba?lant?n?n kapanma süresi (ms)
spring.datasource.hikari.idle-timeout=300000

# Ba?lant?n?n maksimum ya?am süresi (ms)
spring.datasource.hikari.max-lifetime=1800000

# Idle ba?lant?lar? canl? tut (Aiven için ÇOK önemli)
spring.datasource.hikari.keepalive-time=300000

# Pool aç?l???nda DB geçici yoksa uygulamay? durdurma
spring.datasource.hikari.initialization-fail-timeout=0

spring.datasource.hikari.auto-commit=true
