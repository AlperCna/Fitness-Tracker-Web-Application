<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Egzersiz Ekle | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-xl border border-slate-200 w-full max-w-lg relative overflow-hidden">

    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-600 to-orange-500"></div>

    <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Yeni Egzersiz Ekle
    </h2>

    <form th:action="@{/admin/exercises/save}" th:object="${exercise}" method="post" class="space-y-5">

        <div>
            <label class="block text-sm font-bold text-slate-600 mb-2">Egzersiz Adı</label>
            <input type="text" th:field="*{name}"
                   class="w-full p-3 border border-slate-300 rounded-lg focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition"
                   required placeholder="Örn: Bench Press">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-600 mb-2">Görsel / GIF URL (İsteğe Bağlı)</label>
            <input type="text" th:field="*{gifUrl}"
                   class="w-full p-3 border border-slate-300 rounded-lg focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition"
                   placeholder="https://example.com/image.gif">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-600 mb-2">Kategori</label>
            <div class="relative">
                <select name="categoryId" class="w-full p-3 border border-slate-300 rounded-lg focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none bg-white appearance-none cursor-pointer transition" required>
                    <option value="" disabled selected>Bir Kategori Seçin...</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"></option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
            </div>
        </div>

        <div class="flex gap-4 pt-4 border-t border-slate-100 mt-6">
            <a href="/admin/exercises" class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-lg text-center transition">
                İptal
            </a>
            <button type="submit" class="w-2/3 bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-red-500/30 flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
                Kaydet
            </button>
        </div>
    </form>
</div>

</body>
</html>
