<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Egzersiz Yönetimi | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex">

<aside class="w-64 bg-slate-900 text-white flex flex-col fixed h-full z-10">
    <div class="p-6 border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-tight">FitTrack <span class="text-red-500 text-xs align-top">ADMIN</span></h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">
            Dashboard
        </a>
        <a href="/admin/users" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">
            Kullanıcılar
        </a>
        <a href="/admin/exercises" class="flex items-center gap-3 px-4 py-3 bg-red-600 text-white rounded-lg shadow-md">
            Egzersizler
        </a>
        <a href="/admin/categories" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">
            Kategoriler
        </a>
    </nav>
</aside>

<main class="ml-64 flex-1 p-8">
    <header class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-slate-800">Egzersiz Listesi</h2>

        <div class="flex gap-3">
            <a href="/admin/exercises/new" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2.5 rounded-lg font-bold shadow-lg transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Yeni Ekle
            </a>
        </div>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-100 text-xs uppercase text-slate-500 font-bold border-b">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Görsel</th>
                <th class="p-4">İsim</th>
                <th class="p-4">Kategori</th>
                <th class="p-4 text-right">İşlemler</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="ex : ${exercises}" class="hover:bg-slate-50 transition">
                <td class="p-4 text-slate-400 font-mono text-xs" th:text="${'#' + ex.id}">#1</td>

                <td class="p-4">
                    <img th:src="${ex.gifUrl != null && ex.gifUrl != '' ? ex.gifUrl : 'https://placehold.co/50'}"
                         alt="Exercise"
                         class="w-10 h-10 rounded-full object-cover border border-slate-200">
                </td>

                <td class="p-4 font-semibold text-slate-700" th:text="${ex.name}">Bench Press</td>

                <td class="p-4">
                    <span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-bold border border-blue-100"
                          th:text="${ex.category != null ? ex.category.name : '-'}">Göğüs</span>
                </td>

                <td class="p-4 text-right">
                    <a th:href="@{/admin/exercises/delete/{id}(id=${ex.id})}"
                       class="text-red-500 hover:bg-red-50 px-3 py-1 rounded transition text-sm font-bold"
                       onclick="return confirm('Bu egzersizi kalıcı olarak silmek istediğine emin misin?')">
                        Sil
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(exercises)}" class="p-12 text-center text-slate-400 flex flex-col items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <p>Henüz kayıtlı egzersiz bulunmuyor.</p>
        </div>
    </div>
</main>
</body>
</html>
