<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kategori Yönetimi | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex">

<aside class="w-64 bg-slate-900 text-white flex flex-col fixed h-full z-10">
    <div class="p-6 border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-tight">FitTrack <span class="text-red-500 text-xs align-top">ADMIN</span></h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">Dashboard</a>
        <a href="/admin/users" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">Kullanıcılar</a>
        <a href="/admin/exercises" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">Egzersizler</a>
        <a href="/admin/categories" class="flex items-center gap-3 px-4 py-3 bg-red-600 text-white rounded-lg shadow-md">Kategoriler</a>
    </nav>
</aside>

<main class="ml-64 flex-1 p-8">
    <header class="mb-8">
        <h2 class="text-3xl font-bold text-slate-800">Kategori Yönetimi</h2>
        <p class="text-slate-500 text-sm">Sistemdeki egzersiz gruplarını yönetin.</p>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row items-center gap-4">
        <div class="flex-1">
            <h3 class="text-lg font-bold text-slate-700 mb-1">Yeni Kategori Ekle</h3>
            <p class="text-xs text-slate-400">Örn: Kardiyo, Yoga, HIIT</p>
        </div>

        <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="post" class="flex w-full md:w-auto gap-3">
            <input type="text" th:field="*{name}"
                   class="w-full md:w-64 p-3 border border-slate-300 rounded-lg focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition"
                   placeholder="Kategori Adı..." required>

            <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-lg font-bold shadow-lg transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                Ekle
            </button>
        </form>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div th:each="cat : ${categories}" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center group hover:border-red-300 hover:shadow-md transition">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-sm">
                    <span th:text="${cat.name.substring(0,1)}">C</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 font-mono block" th:text="${'ID: ' + cat.id}">ID: 1</span>
                    <span class="text-lg font-bold text-slate-700" th:text="${cat.name}">Cardio</span>
                </div>
            </div>

            <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}"
               class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500 transition"
               title="Sil"
               onclick="return confirm('DİKKAT: Bu kategoriyi silerseniz, ona bağlı egzersizler kategorisiz kalabilir. Devam edilsin mi?')">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(categories)}" class="text-center py-10 text-slate-400">
        Henüz hiç kategori yok. Yukarıdan ekleyebilirsiniz.
    </div>

</main>
</body>
</html>
