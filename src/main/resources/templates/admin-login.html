<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Girişi | FitTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center h-screen relative overflow-hidden">

<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black z-0"></div>
<div class="absolute top-10 left-10 w-72 h-72 bg-red-600/10 rounded-full blur-[80px]"></div>
<div class="absolute bottom-10 right-10 w-72 h-72 bg-orange-600/10 rounded-full blur-[80px]"></div>

<div class="relative z-10 bg-slate-900/50 p-8 rounded-2xl shadow-2xl border border-white/10 w-96 backdrop-blur-md">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-white mb-2">Yönetici Paneli</h2>
        <p class="text-slate-400 text-sm">Devam etmek için kimliğinizi doğrulayın.</p>
    </div>

    <div th:if="${param.error}" class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-lg mb-6 text-sm text-center flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        Hatalı e-posta veya şifre!
    </div>

    <div th:if="${param.logout}" class="bg-green-500/10 border border-green-500/20 text-green-400 p-3 rounded-lg mb-6 text-sm text-center">
        Güvenli çıkış yapıldı.
    </div>

    <form th:action="@{/admin/perform_login}" method="post" class="space-y-5">
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">E-Posta</label>
            <input type="text" name="username" class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition" placeholder="admin@fit.com" required>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Şifre</label>
            <input type="password" name="password" class="w-full px-4 py-3 rounded-lg bg-slate-950 border border-slate-800 text-white focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition" placeholder="••••••••" required>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-bold py-3 rounded-lg transition transform active:scale-95 shadow-lg shadow-red-900/20">
            Giriş Yap
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="/" class="text-xs text-slate-500 hover:text-white transition">← Ana Sayfaya Dön</a>
    </div>
</div>
</body>
</html>
