<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kullanıcı Yönetimi | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex">

<aside class="w-64 bg-slate-900 text-white flex flex-col fixed h-full z-10">
    <div class="p-6 border-b border-slate-800">
        <h1 class="text-2xl font-bold tracking-tight">FitTrack <span class="text-red-500 text-xs align-top">ADMIN</span></h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
        <a href="/admin/dashboard" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">Dashboard</a>
        <a href="/admin/users" class="flex items-center gap-3 px-4 py-3 bg-red-600 text-white rounded-lg shadow-md">Kullanıcılar</a>
        <a href="/admin/exercises" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">Egzersizler</a>
        <a href="/admin/categories" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition">Kategoriler</a>
    </nav>
</aside>

<main class="ml-64 flex-1 p-8">
    <h2 class="text-3xl font-bold text-slate-800 mb-8">Kayıtlı Kullanıcılar</h2>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-100 text-xs uppercase text-slate-500 font-bold border-b">
            <tr>
                <th class="p-4">ID</th>
                <th class="p-4">Kullanıcı Adı</th>
                <th class="p-4">Email</th>
                <th class="p-4">Roller</th>
                <th class="p-4 text-right">İşlem</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="user : ${users}" class="hover:bg-slate-50 transition">
                <td class="p-4 text-slate-400 text-xs" th:text="${user.id}">1</td>
                <td class="p-4 font-bold" th:text="${user.username}">Alper</td>
                <td class="p-4 text-slate-600" th:text="${user.email}">mail@test.com</td>
                <td class="p-4">
                            <span th:each="role : ${user.roles}"
                                  class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-bold mr-1"
                                  th:text="${role.name}">ROLE_USER</span>
                </td>
                <td class="p-4 text-right">
                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}"
                       class="text-red-500 hover:bg-red-50 px-3 py-1 rounded transition text-sm font-bold"
                       onclick="return confirm('Bu kullanıcıyı ve tüm verilerini silmek istediğine emin misin?')">
                        Sil
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
